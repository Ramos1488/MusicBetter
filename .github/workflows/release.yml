name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('MusicBetter/MusicBetter.csproj') }}
          restore-keys: |
            nuget-android-${{ runner.os }}-

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Build Android APK
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-android -c Debug -o ./artifacts/android /p:EnableWindowsTargeting=true

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find ./artifacts/android -name "*-Signed.apk" | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find ./artifacts/android -name "*.apk" | head -n 1)
          fi
          if [ -z "$apk" ]; then
            echo "APK не найден в ./artifacts/android — сборка не создала файл." >&2
            find ./artifacts/android -maxdepth 2 >&2
            exit 1
          fi
          mkdir -p ./out
          cp "$apk" ./out/MusicBetter-android.apk
          echo "APK готов: $(ls -la ./out/MusicBetter-android.apk)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicBetter-android
          path: ./out/MusicBetter-android.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ runner.os }}-${{ hashFiles('MusicBetter/MusicBetter.csproj') }}
          restore-keys: |
            nuget-windows-${{ runner.os }}-

      - name: Install MAUI Workloads
        run: dotnet workload install maui-windows maui-android --source https://api.nuget.org/v3/index.json

      - name: Publish Windows build
        run: >
          dotnet publish MusicBetter/MusicBetter.csproj
          --framework net8.0-windows10.0.19041.0 -c Release
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:RuntimeIdentifierOverride=win-x64
          -o ./artifacts/windows

      - name: Zip Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out | Out-Null
          $files = Get-ChildItem -Path ./artifacts/windows -Force
          if ($files.Count -eq 0) {
            Write-Error "В ./artifacts/windows ничего нет — publish не создал файлы."
            exit 1
          }
          Compress-Archive -Path ./artifacts/windows/* -DestinationPath ./out/MusicBetter-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicBetter-windows
          path: ./out/MusicBetter-windows.zip
          if-no-files-found: error

  release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MusicBetter-android
          path: ./release

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: MusicBetter-windows
          path: ./release

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MusicBetter ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ./release/MusicBetter-android.apk
            ./release/MusicBetter-windows.zip
