name: Release

# Запускается автоматически при пуше тега вида v1.0.0,
# либо вручную из вкладки Actions -> Release -> Run workflow.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore (Android)
        run: dotnet restore MusicBetter/MusicBetter.csproj --framework net8.0-android

      # Debug-сборка подписывается стандартным debug-ключом SDK — устанавливается сразу,
      # без своего keystore. Для публичного релиза в Google Play позже нужен будет
      # отдельный release keystore, но для скачивания и установки apk этого достаточно.
      - name: Build Android APK
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-android -c Debug -o ./artifacts/android

      - name: Rename APK
        shell: bash
        run: |
          apk=$(find ./artifacts/android -name "*-Signed.apk" | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(find ./artifacts/android -name "*.apk" | head -n 1)
          fi
          mkdir -p ./out
          cp "$apk" ./out/MusicBetter-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicBetter-android
          path: ./out/MusicBetter-android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Restore (Windows)
        run: dotnet restore MusicBetter/MusicBetter.csproj --framework net8.0-windows10.0.19041.0

      # Публикуем как самодостаточное unpackaged-приложение (без MSIX, без Store) —
      # можно просто распаковать и запустить .exe без установки.
      - name: Publish Windows build
        run: >
          dotnet publish MusicBetter/MusicBetter.csproj
          --framework net8.0-windows10.0.19041.0 -c Release
          -p:WindowsPackageType=None
          -p:SelfContained=true
          -p:RuntimeIdentifierOverride=win-x64
          -o ./artifacts/windows

      - name: Zip Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./out | Out-Null
          Compress-Archive -Path ./artifacts/windows/* -DestinationPath ./out/MusicBetter-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicBetter-windows
          path: ./out/MusicBetter-windows.zip

  release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: MusicBetter-android
          path: ./release

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: MusicBetter-windows
          path: ./release

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MusicBetter ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ./release/MusicBetter-android.apk
            ./release/MusicBetter-windows.zip
