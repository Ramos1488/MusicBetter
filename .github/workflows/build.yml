name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ runner.os }}-${{ hashFiles('MusicBetter/MusicBetter.csproj') }}
          restore-keys: |
            nuget-android-${{ runner.os }}-

      - name: Show dotnet info
        run: dotnet --info

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --source https://api.nuget.org/v3/index.json

      - name: Build (Android)
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-android -c Debug

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ runner.os }}-${{ hashFiles('MusicBetter/MusicBetter.csproj') }}
          restore-keys: |
            nuget-windows-${{ runner.os }}-

      - name: Show dotnet info
        run: dotnet --info

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --source https://api.nuget.org/v3/index.json

      - name: Build (Windows)
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-windows10.0.19041.0 -c Debug
