name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build (Android)
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-android -c Debug

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build (Windows)
        run: dotnet build MusicBetter/MusicBetter.csproj --framework net8.0-windows10.0.19041.0 -c Debug
